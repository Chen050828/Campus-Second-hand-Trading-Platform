<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园二手交易市场</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .landing { text-align: center; color: #fff; padding: 40px; }
    h1 { font-size: 48px; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
    p { font-size: 18px; margin-bottom: 30px; opacity: 0.9; }
    .btn { display: inline-block; padding: 14px 40px; background: #fff; color: #667eea; text-decoration: none; border-radius: 30px; font-size: 18px; font-weight: bold; margin: 10px; transition: transform 0.2s; }
    .btn:hover { transform: scale(1.05); }
    .btn-outline { background: transparent; border: 2px solid #fff; color: #fff; }
  </style>
</head>
<body>
  <div class="landing">
    <h1>校园二手交易市场</h1>
    <p>安全、便捷的校园二手商品交易平台</p>
    <a href="/frontend/" class="btn">进入商城</a>
    <a href="https://github.com" class="btn btn-outline">查看源码</a>
  </div>
</body>
</html>
