server:
  port: 8088
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/2023011310?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    static-path-pattern: /uploads/**

app:
  jwt:
    secret: campus-market-secret-key-2024-jwt-token-generation
    expiration: 86400000
  upload:
    path: ./uploads
  merchant:
    fee-levels:
      1: 0.001
      2: 0.002
      3: 0.005
      4: 0.0075
      5: 0.01
    auto-confirm-days: 7
    return-hours: 24
  points:
    rate: 100
